[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-overlap-audit"
version = "0.2.0"
description = "Bounded offline iCalendar occupancy and overlap audit"
requires-python = ">=3.11"
dependencies = ["icalendar==6.3.2", "tzdata==2025.2", "python-dateutil==2.9.0.post0", "six==1.17.0"]

[project.scripts]
calendar-shared = "calendar_audit.shared_cli:main"
calendar-freebusy = "calendar_audit.freebusy_cli:main"
calendar-audit = "calendar_audit.cli:main"
calendar-availability = "calendar_audit.availability_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
